<style>
:root{--accent:#e03131;--bg:#f4f6fa;--card:#fff;--ink:#1c2333;--sub:#6b7487;--line:#e5e9f0;--mute:#c9d1de;--good:#12805c;--bad:#c92a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:11px;letter-spacing:0}
nav{display:flex;gap:6px;margin-left:auto}
nav a{padding:7px 16px;border-radius:999px;color:var(--sub);text-decoration:none;font-weight:600;border:1px solid transparent}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--accent);color:#fff}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:24px;margin:4px 0 2px}
.period{color:var(--sub);margin-bottom:18px}
.period b{color:var(--ink)}
h2{font-size:16px;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px}
h2 .tg{margin-left:auto;display:flex;gap:4px}
.tg button{border:1px solid var(--line);background:#fff;color:var(--sub);padding:3px 10px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
.tg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.kpi .l{color:var(--sub);font-size:12px;font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--good)}.dn{color:var(--bad)}.flat{color:var(--sub)}
.kpi .y{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub)}
.kpi .y b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700}
svg{display:block;width:100%;height:auto}
svg text{font-family:inherit}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:700;font-size:12px;background:#fafbfd;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;background:#fafbfd}
.tscroll{overflow:auto;max-height:420px;border-radius:10px}
.tscroll td.l,.tscroll th.l{text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef1f6;color:var(--sub)}
.tag.ok{background:#dff5ea;color:var(--good)}.tag.wait{background:#fff1d6;color:#9a6200}.tag.no{background:#fde2e2;color:var(--bad)}
a{color:var(--accent)}
.empty{color:var(--sub);padding:18px;text-align:center}
.note{color:var(--sub);font-size:12px;margin-top:26px;line-height:1.7}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:600px){nav{margin-left:0}.kpi .v{font-size:22px}}

function card(label,cur,prev,fmt,ytd,good=true){
  let d='<span class="flat">–</span>';

    if(Math.abs(df)<1e-9)d='<span class="flat">전주와 동일</span>';
    else{const pct=prev?Math.abs(df/prev*100).toFixed(0)+'%':'';
      const cls=!good?'flat':(df>0?'up':'dn');
      d='<span class="'+cls+'">'+(df>0?'▲':'▼')+' '+(fmt==='pct'?Math.abs(df*100).toFixed(1)+'%p':fmt===1?Math.abs(df).toFixed(1):cp(Math.abs(df)))+(pct&&fmt!=='pct'?' ('+pct+')':'')+'</span> <span class="flat">전주 대비</span>'}}
  const val=fmt==='pct'?(cur*100).toFixed(1)+'%':fmt===1?cur.toFixed(1)+'원':cp(cur)+(label.includes('비용')?'원':'');
  const yv=fmt==='pct'?(ytd*100).toFixed(1)+'%':fmt===1?ytd.toFixed(1)+'원':cp(ytd)+(label.includes('비용')?'원':'');
  return '<div class="kpi"><div class="l">'+label+'</div><div class="v">'+val+'</div><div class="d">'+d+'</div><div class="y">2026 누계 <b>'+yv+'</b></div></div>'}

function nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function tl(x){return x>=1e4?cp(x):(Number.isInteger(x)?x.toLocaleString('ko-KR'):x.toFixed(1))}
function frame(labels,max,w,h,pad){
  let s='<svg viewBox="0 0 '+w+' '+h+'" role="img">';
  const ih=h-pad.t-pad.b; const ticks=4;
  for(let i=0;i<=ticks;i++){const y=pad.t+ih-ih*i/ticks;
    s+='<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="#e5e9f0"/>';
    s+='<text x="'+(pad.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#8a93a6">'+tl(max*i/ticks)+'</text>'}
  const step=Math.ceil(labels.length/10), iw=w-pad.l-pad.r, bw=iw/labels.length;
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)s+='<text x="'+(pad.l+bw*(i+.5))+'" y="'+(h-pad.b+15)+'" text-anchor="middle" font-size="10" fill="#8a93a6">'+l+'</text>'});
  return s}
function bars(el,labels,series,fmtv){
  const w=560,h=230,pad={l:44,r:10,t:10,b:26};
  const mx=nice(Math.max(1,...series.flatMap(s=>s.v)));let s=frame(labels,mx,w,h,pad);
  const ih=h-pad.t-pad.b, iw=w-pad.l-pad.r, bw=iw/labels.length, k=series.length, g=Math.min(bw*.78,26*k), sw=g/k;
  series.forEach((se,si)=>se.v.forEach((v,i)=>{const bh=ih*v/mx, x=pad.l+bw*i+(bw-g)/2+sw*si;
    s+='<rect x="'+x+'" y="'+(pad.t+ih-bh)+'" width="'+Math.max(sw-1,1)+'" height="'+Math.max(bh,0)+'" rx="2" fill="'+se.c+'"><title>'+labels[i]+' · '+se.n+' '+(fmtv?fmtv(v):nf(v))+'</title></rect>'}));
  $(el).innerHTML=s+'</svg>'}
function barLine(el,labels,bar,line){
  const w=560,h=230,pad={l:44,r:40,t:10,b:26};
  const mx=nice(Math.max(1,...bar.v)), mx2=nice(Math.max(.1,...line.v));
  let s=frame(labels,mx,w,h,pad); const ih=h-pad.t-pad.b, iw=w-pad.l-pad.r, bw=iw/labels.length;
  [0,1,2,3,4].forEach(i=>{s+='<text x="'+(w-pad.r+6)+'" y="'+(pad.t+ih-ih*i/4+4)+'" font-size="10" fill="'+INK+'">'+(mx2*i/4).toFixed(1)+'</text>'});
  bar.v.forEach((v,i)=>{const bh=ih*v/mx,x=pad.l+bw*i+(bw-Math.min(bw*.7,22))/2;
    s+='<rect x="'+x+'" y="'+(pad.t+ih-bh)+'" width="'+Math.min(bw*.7,22)+'" height="'+bh+'" rx="2" fill="'+bar.c+'"><title>'+labels[i]+' · 협업비용 '+nf(v)+'원</title></rect>'});
  let pts=line.v.map((v,i)=>[pad.l+bw*(i+.5),pad.t+ih-ih*v/mx2]);
  s+='<polyline fill="none" stroke="'+INK+'" stroke-width="2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#fff" stroke="'+INK+'" stroke-width="1.5"><title>'+labels[i]+' · 누적 CPV '+line.v[i].toFixed(2)+'원</title></circle>'});
  $(el).innerHTML=s+'</svg>'}
function area(el,labels,v,color){
  const w=560,h=230,pad={l:44,r:10,t:10,b:26};const mx=nice(Math.max(1,...v));let s=frame(labels,mx,w,h,pad);
  const ih=h-pad.t-pad.b, iw=w-pad.l-pad.r, bw=iw/labels.length;
  const pts=v.map((x,i)=>[pad.l+bw*(i+.5),pad.t+ih-ih*x/mx]);
  s+='<polygon fill="'+color+'" fill-opacity=".12" points="'+pad.l+','+(pad.t+ih)+' '+pts.map(p=>p.join(',')).join(' ')+' '+(pad.l+iw)+','+(pad.t+ih)+'"/>';
  s+='<polyline fill="none" stroke="'+color+'" stroke-width="2.2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+color+'"><title>'+labels[i]+' · '+nf(v[i])+'</title></circle>'});
  $(el).innerHTML=s+'</svg>'}

const LS=D.lists;
const defs=[
 ['recent_contact','최근 2주 섭외 ('+LS.n_recent_contact+')',['ID','채널','컨택일','진행여부','매장'],r=>[idc(r),esc(r.ch),r.cdate,stTag(r.status),esc(r.store)]],
 ['recent_upload','최근 2주 업로드 ('+LS.n_recent_upload+')',['ID','채널','업로드일','매장','좋아요'+(D.key==='japan'?' · 조회':'')],r=>[(r.ulink?'<a href="'+esc(r.ulink)+'" target="_blank" rel="noopener">'+esc(r.id)+'</a>':idc(r)),esc(r.ch),r.udate,esc(r.store),(r.likes?nf(r.likes):'–')+(D.key==='japan'&&r.views?' · '+nf(r.views):'')]],
 ['pending','방문 예정 ('+LS.n_pending+')',['ID','채널','방문 예정일','매장','진행여부'],r=>[idc(r),esc(r.ch),r.vdate||'미정',esc(r.store),stTag(r.status)]],
];
$('#ltabs').innerHTML=defs.map((d,i)=>'<button data-i="'+i+'">'+d[1]+'</button>').join('');
function showList(i){const d=defs[i],rows=LS[d[0]];
  document.querySelectorAll('#ltabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
  $('#ltable').innerHTML=rows.length?'<table><thead><tr>'+d[2].map((h,j)=>'<th'+(j<2||h==='매장'?' class="l"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+d[3](r).map((c,j)=>'<td'+(j<2||d[2][j]==='매장'?' class="l"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">해당 인원이 없습니다</div>'}
document.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>showList(+b.dataset.i));
showList(0);
</script>
</body>
</html>
