    s+='<rect x="'+x+'" y="'+(pad.t+ih-bh)+'" width="'+Math.min(bw*.7,22)+'" height="'+bh+'" rx="2" fill="'+bar.c+'"><title>'+labels[i]+' · 협업비용 '+nf(v)+'원</title></rect>'});
  let pts=line.v.map((v,i)=>[pad.l+bw*(i+.5),pad.t+ih-ih*v/mx2]);
  s+='<polyline fill="none" stroke="'+INK+'" stroke-width="2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#fff" stroke="'+INK+'" stroke-width="1.5"><title>'+labels[i]+' · 누적 CPV '+line.v[i].toFixed(2)+'원</title></circle>'});
  $(el).innerHTML=s+'</svg>'}
function area(el,labels,v,color){
  const w=560,h=230,pad={l:44,r:10,t:10,b:26};const mx=nice(Math.max(1,...v));let s=frame(labels,mx,w,h,pad);
  const ih=h-pad.t-pad.b, iw=w-pad.l-pad.r, bw=iw/labels.length;
  const pts=v.map((x,i)=>[pad.l+bw*(i+.5),pad.t+ih-ih*x/mx]);
  s+='<polygon fill="'+color+'" fill-opacity=".12" points="'+pad.l+','+(pad.t+ih)+' '+pts.map(p=>p.join(',')).join(' ')+' '+(pad.l+iw)+','+(pad.t+ih)+'"/>';
  s+='<polyline fill="none" stroke="'+color+'" stroke-width="2.2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+color+'"><title>'+labels[i]+' · '+nf(v[i])+'</title></circle>'});
  $(el).innerHTML=s+'</svg>'}
$('#t3').textContent='주간 '+D.viewsLabel;
$('#lg1').innerHTML='<span><i style="background:'+GRAY+'"></i>컨택</span><span><i style="background:'+ACC+'"></i>완료</span>';
$('#lg4').innerHTML='<span><i style="background:'+GRAY+'"></i>협업비용(원)</span><span><i style="background:'+INK+'"></i>누적 CPV(원, 우측)</span>';
function draw(n){
  const ws=n?W.slice(-n):W, lab=ws.map(w=>md(w.start));
  bars('#c1',lab,[{n:'컨택',c:GRAY,v:ws.map(w=>w.contact)},{n:'완료',c:ACC,v:ws.map(w=>w.done)}]);
  bars('#c2',lab,[{n:'업로드',c:ACC,v:ws.map(w=>w.uploads)}]);
  area('#c3',lab,ws.map(views),ACC);
  let cc=0,cv=0;const cum=W.map(w=>{cc+=w.cost;cv+=w.views;return cv?cc/cv:0});
  barLine('#c4',lab,{c:GRAY,v:ws.map(w=>w.cost)},{v:cum.slice(W.length-ws.length)})}
document.querySelectorAll('#rangeTg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rangeTg button').forEach(x=>x.classList.toggle('on',x===b));draw(+b.dataset.n)});
draw(12);

// ---- monthly
const mo={};W.forEach(w=>{const m=w.start.slice(0,7);if(w.start.startsWith('2026'))(mo[m]=mo[m]||[]).push(w)});
const cols=[['contact','컨택'],['done','완료'],['uploads','업로드'],...(D.hasSaves?[['saves','저장'],['likes','좋아요']]:[]),['views',D.viewsLabel],['cost','협업비용']];
let t='<table><thead><tr><th>월</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>CPV(원)</th></tr></thead><tbody>';
Object.keys(mo).sort().forEach(m=>{const a=mo[m];t+='<tr><td>'+(+m.slice(5))+'월</td>'+cols.map(c=>'<td>'+nf(sum(a,c[0]))+'</td>').join('')+'<td>'+(sum(a,'views')?cpv(sum(a,'cost'),sum(a,'views')).toFixed(1):'–')+'</td></tr>'});
t+='</tbody><tfoot><tr><td>2026 합계</td>'+cols.map(c=>'<td>'+nf(sum(W,c[0]))+'</td>').join('')+'<td>'+(ytd.v?cpv(ytd.m,ytd.v).toFixed(1):'–')+'</td></tr></tfoot></table>';
$('#monthly').innerHTML=t;

// ---- funnel / stores
function hbars(el,rows,color){
  const mx=Math.max(1,...rows.map(r=>r[1]));
  $(el).innerHTML=rows.length?rows.map((r,i)=>'<div style="display:flex;align-items:center;gap:10px;margin:7px 0"><div style="width:130px;font-size:13px;color:var(--sub)">'+esc(r[0])+'</div><div style="flex:1;background:#eef1f6;border-radius:6px;height:22px;overflow:hidden"><div style="width:'+(r[1]/mx*100)+'%;background:'+(color||ACC)+';height:100%;opacity:'+(color?1:Math.max(.45,1-i*.13))+'"></div></div><div style="width:64px;text-align:right;font-weight:700">'+nf(r[1])+'</div></div>').join(''):'<div class="empty">데이터 없음</div>'}
const fu=D.lists.funnel;hbars('#funnel',fu);
const SM=D.lists.stores_month, SMONTHS=[...new Set(SM.map(x=>x[0]))].sort((a,b)=>a-b);
let stSel=SMONTHS.length?SMONTHS[SMONTHS.length-1]:0;  // 기본: 가장 최근 월
function storesView(){
  const chips=SMONTHS.map(m=>'<button data-m="'+m+'"'+(stSel===m?' class="on"':'')+'>'+m+'월</button>').join('')+'<button data-m="0"'+(stSel===0?' class="on"':'')+'>2026 누계</button><button data-m="-1"'+(stSel===-1?' class="on"':'')+'>월×매장 표</button>';
  $('#stTg').innerHTML=chips;
  if(stSel>0){
    const rows=SM.filter(x=>x[0]===stSel).map(x=>[x[1],x[2]]).sort((a,b)=>b[1]-a[1]);
    $('#stTitle').textContent='매장별 방문 완료 · 2026년 '+stSel+'월 (합계 '+rows.reduce((a,x)=>a+x[1],0)+'명)';
    hbars('#stores',rows,ACC)
  }else if(stSel===0){
    $('#stTitle').textContent='매장별 방문 완료 · 2026 누계 (합계 '+D.lists.stores.reduce((a,x)=>a+x[1],0)+'명)';
    hbars('#stores',D.lists.stores.slice(0,8),ACC)
  }else{
    $('#stTitle').textContent='매장별 방문 완료 · 월×매장 (2026)';
    const names=D.lists.stores.map(x=>x[0]), g={};SM.forEach(([mo,st,n])=>{(g[st]=g[st]||{})[mo]=n});
    const mx=Math.max(1,...SM.map(x=>x[2]));
    let t='<div class="tscroll" style="max-height:none"><table><thead><tr><th class="l">매장</th>'+SMONTHS.map(x=>'<th class="c">'+x+'월</th>').join('')+'<th class="c">합계</th></tr></thead><tbody>';
    names.forEach(st=>{const row=g[st]||{};let tot=0;
      t+='<tr><td class="l">'+esc(st)+'</td>'+SMONTHS.map(mo=>{const n=row[mo]||0;tot+=n;return '<td class="c" style="'+(n?'background:color-mix(in srgb,'+ACC+' '+Math.round(12+n/mx*55)+'%,#fff);font-weight:700':'color:#b6bdcc')+'">'+(n||'·')+'</td>'}).join('')+'<td class="c"><b>'+tot+'</b></td></tr>'});
    t+='</tbody><tfoot><tr><td class="l">합계</td>'+SMONTHS.map(mo=>'<td class="c">'+SM.filter(x=>x[0]===mo).reduce((a,x)=>a+x[2],0)+'</td>').join('')+'<td class="c">'+SM.reduce((a,x)=>a+x[2],0)+'</td></tr></tfoot></table></div>';
    $('#stores').innerHTML=t}
  document.querySelectorAll('#stTg button').forEach(b=>b.onclick=()=>{stSel=+b.dataset.m;storesView()})}
storesView();

// ---- lists
const stTag=s=>'<span class="tag '+(s==='완료'?'ok':s==='진행중'?'wait':(s==='협업무산'||s==='거절'||s==='로스')?'no':'')+'">'+esc(s||'–')+'</span>';
const idc=r=>r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.id)+'</a>':esc(r.id);
const LS=D.lists;
const lk=r=>r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.id)+'</a>':esc(r.id);
const dt=x=>x||'–';
const won=x=>x?nf(x)+'원':'–';
const n0=x=>x?nf(x):'–';
const linkCell=r=>(r.vlinks&&r.vlinks.length)?r.vlinks.map(v=>'<a class="chip" href="'+esc(v.u)+'" target="_blank" rel="noopener">'+esc(v.p)+' ↗</a>').join(' '):'<span class="flat">링크 없음</span>';
const cpvOf=(c,v)=>(c&&v)?(c/v).toFixed(1)+'원':'–';
const perOf=(c,v)=>(c&&v)?nf(c/v)+'원':'–';
const VL=D.key==='china'?'예상 조회수(좋아요×50)':'조회수';
const UCOLS=[['컨택일',r=>dt(r.cdate)],['방문일',r=>dt(r.vdate)],['업로드일',r=>dt(r.udate)],['ID',r=>lk(r)],['채널',r=>esc(r.ch)],['매장',r=>esc(r.store)],
 ['비용',r=>won(r.cost)],['좋아요',r=>n0(r.likes)],[VL,r=>n0(r.views)]]
 .concat(D.key==='china'?[['저장수',r=>n0(r.saves)],['CPV(비용/예상조회수)',r=>cpvOf(r.cost,r.views)]]
                        :[['저장+공유',r=>n0(r.saves)],['CPV(비용/조회수)',r=>cpvOf(r.cost,r.views)],['저장공유당 비용',r=>perOf(r.cost,r.saves)]])
 .concat([['영상 링크',linkCell]]);
const defs=[
 ['recent_contact','최근 2주 섭외 ('+LS.n_recent_contact+')',['ID','채널','컨택일','방문일','업로드일','매장','진행여부'],r=>[idc(r),esc(r.ch),dt(r.cdate),dt(r.vdate),dt(r.udate),esc(r.store),stTag(r.status)]],
 ['uploads','업로드 완료 · 영상 링크 ('+LS.n_uploads+')',UCOLS.map(c=>c[0]),r=>UCOLS.map(c=>c[1](r))],
 ['pending','방문 예정 ('+LS.n_pending+')',['ID','채널','컨택일','방문일','업로드일','매장','진행여부'],r=>[idc(r),esc(r.ch),dt(r.cdate),r.vdate||'미정',dt(r.udate),esc(r.store),stTag(r.status)]],
];
$('#ltabs').innerHTML=defs.map((d,i)=>'<button data-i="'+i+'">'+d[1]+'</button>').join('');
let MF='';
const AL={'업로드일':'c','컨택일':'c','방문일':'c','ID':'l id','채널':'c','매장':'c','진행여부':'c','영상 링크':'l lk'};
const alc=h=>AL[h]||'r';
function showList(i){const d=defs[i];let rows=LS[d[0]];
  document.querySelectorAll('#ltabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
  let bar='';
  if(d[0]==='uploads'){const ms=[...new Set(rows.map(r=>r.udate.slice(0,7)))].sort().reverse();
    bar='<div style="margin:0 0 10px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--sub)">업로드 월 <select id="mf" style="padding:5px 10px;border:1px solid var(--line);border-radius:8px;font:inherit"><option value="">전체</option>'+ms.map(m=>'<option value="'+m+'"'+(m===MF?' selected':'')+'>'+(+m.slice(5))+'월</option>').join('')+'</select><span>영상 링크 '+LS.n_with_link+'/'+LS.n_uploads+'건 등록</span></div>';
    if(MF)rows=rows.filter(r=>r.udate.startsWith(MF));
    const S=(f)=>rows.reduce((a,r)=>a+(r[f]||0),0), pc=rows.filter(r=>r.cost&&r.views), ps=rows.filter(r=>r.cost&&r.saves);
    const sc=pc.reduce((a,r)=>a+r.cost,0), sv=pc.reduce((a,r)=>a+r.views,0), ss=ps.reduce((a,r)=>a+r.cost,0), sw=ps.reduce((a,r)=>a+r.saves,0);
    bar+='<div class="sum"><div><span>업로드</span><b>'+rows.length+'명</b></div><div><span>비용 입력</span><b>'+rows.filter(r=>r.cost).length+'명 · '+won(S('cost'))+'</b></div><div><span>좋아요 합</span><b>'+n0(S('likes'))+'</b></div><div><span>'+VL+' 합</span><b>'+n0(S('views'))+'</b></div><div><span>CPV <small>(비용·조회수 모두 입력된 '+pc.length+'명)</small></span><b>'+(sv?(sc/sv).toFixed(1)+'원':'–')+'</b></div>'+(D.key==='china'?'':'<div><span>저장공유당 비용 <small>('+ps.length+'명)</small></span><b>'+(sw?nf(ss/sw)+'원':'–')+'</b></div>')+'</div>'}
  const th=d[2].map(h=>'<th class="'+alc(h).split(' ')[0]+'">'+h+'</th>').join('');
  $('#ltable').innerHTML=bar+(rows.length?'<div class="tscroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+d[3](r).map((c,j)=>'<td class="'+alc(d[2][j])+'">'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">해당 인원이 없습니다</div>');
  const sel=$('#mf');if(sel)sel.onchange=()=>{MF=sel.value;showList(i)}}
document.querySelectorAll('#ltabs button').forEach(b=>b.onclick=()=>showList(+b.dataset.i));
showList(1);
</script>
